# androidx.work is an AndroidX dependency, and AGP refuses to build against
# AndroidX unless this is set. Without this file the project does not compile
# at all - in Android Studio or on the command line.
android.useAndroidX=true

# R classes carry only this module's resources rather than every dependency's.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
