apiVersion: 1

providers:
  - name: chimera-health
    orgId: 1
    folder: Health
    type: file
    disableDeletion: false
    # Dashboards are code. Edits made in the UI are overwritten on reload -
    # export the JSON back into grafana/dashboards/ to keep a change.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
